# dfnWorks regression cases.
#
# tier         baseline | modest | advanced  (tiers are cumulative when run)
# source       directory copied to scratch, relative to this file
# driver       script run with cwd = scratch copy (default driver.py)
# output_dir   basename of the DFN jobname inside the copy (default "output")
# stages       which metric extractors / expected outputs apply:
#              gen, report, mesh, mesh_visual, dfm, pflotran, fehm, dfntrans,
#              graph_flow, graph_transport
# requires     preflight keys; derived from stages unless given
# expect_files extra glob patterns (relative to scratch) that must exist
# tolerances   {metric_or_stage = rel_tol} overrides of harness/compare.py defaults
# timeout      seconds (default below)

[defaults]
timeout = 600

# ---------------------------------------------------------------- baseline
# One deterministic case per generator feature and mesh mode; the cheapest
# cases carry the full gen -> mesh -> flow -> transport chain.

[cases.4_user_rects]
tier = "baseline"
source = "../4_user_rects"
stages = ["gen", "mesh", "pflotran", "dfntrans"]
timeout = 300

[cases.4_user_ell_uniform]
tier = "baseline"
source = "../4_user_ell_uniform"
stages = ["gen", "mesh", "pflotran", "dfntrans"]
